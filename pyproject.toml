[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resai"
version = "0.1.0"
description = "Evidence-bound readiness gates for shared-cluster experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
resai = "resai.cli:main"
resai-mcp = "resai.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
